<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HKN Book Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --olive:      #3D5A3E;
  --olive-mid:  #6B8F71;
  --olive-pale: #EFF5EF;
  --orange:     #E8824A;
  --orange-dark:#C4612B;
  --ink:        #1A1A12;
  --ink-light:  #6B6B52;
  --cream:      #FAF6EF;
  --cream-dark: #F0E8D8;
  --border:     #D4C9A8;
  --success:    #2E7D32;
  --danger:     #C62828;
  --radius:     10px;
  --serif:      'Cormorant Garamond', serif;
  --sans:       'Nunito', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); background: var(--cream); color: var(--ink); min-height: 100vh; }

/* ── Nav ── */
.nav {
  background: var(--olive);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.nav-title { font-family: var(--serif); font-size: 20px; color: white; font-weight: 600; }
.nav-sub   { font-size: 11px; color: rgba(255,255,255,0.6); margin-left: 10px; }
.nav-right { display: flex; align-items: center; gap: 12px; }
.nav-user  { font-size: 12px; color: rgba(255,255,255,0.75); }
.btn-nav   { font-family: var(--sans); font-size: 12px; font-weight: 600;
             background: rgba(255,255,255,0.15); color: white; border: none;
             border-radius: 6px; padding: 6px 14px; cursor: pointer; transition: background 0.2s; }
.btn-nav:hover { background: rgba(255,255,255,0.25); }

/* ── Login ── */
#login-screen {
  display: flex; align-items: center; justify-content: center;
  min-height: calc(100vh - 56px);
}
.login-card {
  background: white; border-radius: var(--radius); padding: 40px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08); max-width: 380px; width: 100%;
  text-align: center;
}
.login-card h2 { font-family: var(--serif); font-size: 26px; color: var(--olive); margin-bottom: 8px; }
.login-card p  { font-size: 13px; color: var(--ink-light); margin-bottom: 28px; line-height: 1.6; }
.btn-google {
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--olive); color: white; border: none; border-radius: 8px;
  padding: 12px 24px; font-family: var(--sans); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: background 0.2s; width: 100%; justify-content: center;
}
.btn-google:hover { background: var(--olive-mid); }

/* ── Main layout ── */
#app-screen { display: none; }
.container { max-width: 900px; margin: 0 auto; padding: 28px 20px 60px; }

/* ── Cards ── */
.card {
  background: white; border-radius: var(--radius);
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  margin-bottom: 20px; overflow: hidden;
}
.card-header {
  background: var(--olive-pale); border-bottom: 1px solid var(--border);
  padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
}
.card-title { font-family: var(--serif); font-size: 18px; color: var(--olive); font-weight: 600; }
.card-body  { padding: 20px; }

/* ── Summary table ── */
.summary-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.summary-table th {
  background: var(--olive); color: white; padding: 10px 12px;
  font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
  text-align: center;
}
.summary-table th:first-child, .summary-table th:nth-child(2) { text-align: left; }
.summary-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: center; }
.summary-table td:first-child { font-weight: 600; color: var(--olive); text-align: left; }
.summary-table td:nth-child(2) { text-align: left; color: var(--ink-light); font-size: 12px; }
.summary-table tr.totals td { background: var(--olive-pale); font-weight: 700; color: var(--olive); border-top: 2px solid var(--border); }
.remaining-ok   { color: var(--success); font-weight: 700; }
.remaining-low  { color: var(--orange-dark); font-weight: 700; }
.remaining-zero { color: var(--danger); font-weight: 700; }

/* Level colors */
.lvl-0-dark  { background: #D6E4FF; } .lvl-0-light { background: #EBF2FF; }
.lvl-1-dark  { background: #D4EDDA; } .lvl-1-light { background: #E8F5EC; }
.lvl-2-dark  { background: #FFF3CD; } .lvl-2-light { background: #FFFAEB; }
.lvl-3-dark  { background: #F8D7DA; } .lvl-3-light { background: #FDF0F1; }
.lvl-4-dark  { background: #E8D5F5; } .lvl-4-light { background: #F4EAF9; }

/* ── Forms ── */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group label { font-size: 11px; font-weight: 700; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.05em; }
.form-group input, .form-group select, .form-group textarea {
  font-family: var(--sans); font-size: 13px; color: var(--ink);
  border: 1.5px solid var(--border); border-radius: 6px; padding: 8px 10px;
  background: white; transition: border-color 0.2s; outline: none;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--olive-mid);
}
.form-group textarea { resize: vertical; min-height: 60px; }
.form-full { grid-column: 1 / -1; }

/* ── Buttons ── */
.btn { font-family: var(--sans); font-size: 13px; font-weight: 600; border: none;
       border-radius: 8px; padding: 10px 20px; cursor: pointer; transition: all 0.2s; }
.btn-primary   { background: var(--olive); color: white; }
.btn-primary:hover { background: var(--olive-mid); }
.btn-secondary { background: var(--cream-dark); color: var(--ink); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-link { background: none; border: none; color: var(--orange); font-size: 12px;
            font-weight: 600; cursor: pointer; padding: 0; font-family: var(--sans); }
.btn-link:hover { text-decoration: underline; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 999;
  background: var(--olive); color: white; border-radius: 8px;
  padding: 12px 20px; font-size: 13px; font-weight: 500;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  transform: translateY(80px); opacity: 0; transition: all 0.3s;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.error { background: var(--danger); }

/* ── Loading ── */
.loading { text-align: center; padding: 32px; color: var(--ink-light); font-size: 13px; }

/* ── Sheets link ── */
.sheets-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--olive-mid); text-decoration: none; font-weight: 600;
}
.sheets-link:hover { color: var(--olive); text-decoration: underline; }
</style>
</head>
<body>

<nav class="nav">
  <div style="display:flex;align-items:center;">
    <span class="nav-title">📚 Book Inventory</span>
    <span class="nav-sub">Hindi Ki Neev</span>
  </div>
  <div class="nav-right">
    <span class="nav-user" id="nav-user"></span>
    <button class="btn-nav" id="logout-btn" onclick="doLogout()" style="display:none">Sign out</button>
  </div>
</nav>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-card">
    <h2>Book Inventory</h2>
    <p>Sign in with your HKN admin account to manage book inventory, log replacements, and track teacher copies.</p>
    <button class="btn-google" onclick="doLogin()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </button>
  </div>
</div>

<!-- App Screen -->
<div id="app-screen">
  <div class="container">

    <!-- Summary -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">Inventory Summary</div>
        <a href="https://docs.google.com/spreadsheets/d/1msQkJI_Th1bdslm-frqhwnqGIrwQp8Xl/edit" target="_blank" class="sheets-link">
          📊 Open full spreadsheet →
        </a>
      </div>
      <div class="card-body" style="padding:0;">
        <div id="summary-area" class="loading">Loading inventory data…</div>
      </div>
    </div>

    <!-- Log Replacement -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">Log Student Replacement</div>
      </div>
      <div class="card-body">
        <div class="form-grid">
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="rep-date"/>
          </div>
          <div class="form-group">
            <label>Student Name</label>
            <input type="text" id="rep-student" placeholder="First Last"/>
          </div>
          <div class="form-group">
            <label>Book Level</label>
            <select id="rep-level">
              <option value="">— Select —</option>
              <option>Book 1</option><option>Book 2</option><option>Book 3</option>
              <option>Book 4</option><option>Book 5</option>
            </select>
          </div>
          <div class="form-group">
            <label>Book Type</label>
            <select id="rep-type">
              <option value="">— Select —</option>
              <option>Textbook</option>
              <option>Exercise Book</option>
            </select>
          </div>
          <div class="form-group">
            <label>Reason</label>
            <select id="rep-reason">
              <option value="">— Select —</option>
              <option>Lost</option><option>Damaged</option><option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Notes</label>
            <input type="text" id="rep-notes" placeholder="Optional notes"/>
          </div>
        </div>
        <div style="margin-top:16px; display:flex; gap:10px; align-items:center;">
          <button class="btn btn-primary" onclick="logReplacement()">Save Replacement</button>
          <button class="btn btn-secondary" onclick="clearRepForm()">Clear</button>
        </div>
      </div>
    </div>

    <!-- Log Teacher Copy -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">Log Teacher Copy</div>
      </div>
      <div class="card-body">
        <div class="form-grid">
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="tch-date"/>
          </div>
          <div class="form-group">
            <label>Teacher Name</label>
            <input type="text" id="tch-teacher" placeholder="Teacher name"/>
          </div>
          <div class="form-group">
            <label>Book Level</label>
            <select id="tch-level">
              <option value="">— Select —</option>
              <option>Book 1</option><option>Book 2</option><option>Book 3</option>
              <option>Book 4</option><option>Book 5</option>
            </select>
          </div>
          <div class="form-group">
            <label>Book Type</label>
            <select id="tch-type">
              <option value="">— Select —</option>
              <option>Textbook</option>
              <option>Exercise Book</option>
            </select>
          </div>
          <div class="form-group">
            <label>Reason</label>
            <select id="tch-reason">
              <option value="">— Select —</option>
              <option>New teacher</option>
              <option>New class level</option>
              <option>Reference copy</option>
              <option>Replacement</option>
              <option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Returned?</label>
            <select id="tch-returned">
              <option value="No">No</option>
              <option value="Yes">Yes</option>
            </select>
          </div>
          <div class="form-group form-full">
            <label>Notes</label>
            <input type="text" id="tch-notes" placeholder="Optional notes"/>
          </div>
        </div>
        <div style="margin-top:16px; display:flex; gap:10px; align-items:center;">
          <button class="btn btn-primary" onclick="logTeacherCopy()">Save Teacher Copy</button>
          <button class="btn btn-secondary" onclick="clearTchForm()">Clear</button>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
// ── Config ───────────────────────────────────────────────────
const CLIENT_ID   = ''; // Set via School Attributes / same as portal
const SHEET_ID    = '1msQkJI_Th1bdslm-frqhwnqGIrwQp8Xl';
const DRIVE_FILE_ID = '1IIRLOJGGTcI2zlnXqKJSdOIkb-iYbo5m';
const SCOPES      = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.readonly email profile';
const ADMIN_EMAILS = ['portal@hindikineev.org', 'rajiv@hindikineev.org'];

let accessToken = null;
let tokenExpiry  = null;

// ── Auth ──────────────────────────────────────────────────────
// Simpler: load client ID from the portal's Drive JSON after getting a basic token
// We use a two-step: get basic profile token first, then full token
function doLogin() {
  const TEMP_CLIENT_ID_KEY = 'hkn_gmail_client_id';
  let clientId = localStorage.getItem(TEMP_CLIENT_ID_KEY);

  const proceed = (cid) => {
    google.accounts.oauth2.initTokenClient({
      client_id: cid,
      scope: SCOPES,
      callback: async (resp) => {
        if (resp.error) { showToast('Sign in failed: ' + resp.error, true); return; }
        accessToken = resp.access_token;
        tokenExpiry = Date.now() + (resp.expires_in * 1000);
        const info = await fetch('https://www.googleapis.com/oauth2/v3/userinfo',
          { headers: { Authorization: 'Bearer ' + accessToken }}).then(r => r.json());
        if (!ADMIN_EMAILS.includes(info.email)) {
          accessToken = null;
          showToast('Access denied — admin accounts only', true); return;
        }
        document.getElementById('nav-user').textContent = info.email;
        document.getElementById('logout-btn').style.display = 'block';
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        setDefaultDates();
        loadSummary();
      }
    }).requestAccessToken();
  };

  if (clientId) { proceed(clientId); return; }

  // Prompt admin to enter client ID once
  const cid = prompt('Enter Gmail OAuth Client ID (from School Attributes in the portal):\nThis will be saved for future logins.');
  if (!cid) return;
  localStorage.setItem(TEMP_CLIENT_ID_KEY, cid);
  proceed(cid);
}

function doLogout() {
  accessToken = null; tokenExpiry = null;
  document.getElementById('logout-btn').style.display = 'none';
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('nav-user').textContent = '';
}

// ── Sheets API helpers ────────────────────────────────────────
async function sheetsGet(range) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}`;
  const res = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken }});
  if (!res.ok) throw new Error('Sheets read failed: ' + res.status);
  return (await res.json()).values || [];
}

async function sheetsAppend(sheet, values) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(sheet + '!A:A')}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
    body: JSON.stringify({ values })
  });
  if (!res.ok) throw new Error('Sheets write failed: ' + res.status);
  return res.json();
}

// ── Load Summary ──────────────────────────────────────────────
async function loadSummary() {
  document.getElementById('summary-area').innerHTML = '<div class="loading">Loading inventory data…</div>';
  try {
    // Read Summary tab rows 4-13 (10 data rows: 5 levels × 2 types), columns A-G
    const rows = await sheetsGet("'Inventory Summary'!A4:G13");
    const totals = await sheetsGet("'Inventory Summary'!A14:G14");

    const LEVEL_CLASSES = ['lvl-0','lvl-1','lvl-2','lvl-3','lvl-4'];

    let html = `<table class="summary-table">
      <thead><tr>
        <th>Book Level</th><th>Book Type</th>
        <th>Starting Stock</th><th>Distributed</th>
        <th>Replacements</th><th>Teacher Copies</th>
        <th>Remaining</th>
      </tr></thead><tbody>`;

    rows.forEach((row, i) => {
      const lvl  = Math.floor(i / 2);
      const type = i % 2 === 0 ? 'dark' : 'light';
      const cls  = `${LEVEL_CLASSES[lvl]}-${type}`;
      const rem  = parseInt(row[6]) || 0;
      const remClass = rem <= 0 ? 'remaining-zero' : rem <= 5 ? 'remaining-low' : 'remaining-ok';
      const tchCell = row[5] === '—' ? '<span style="color:var(--ink-light)">—</span>' : (row[5] || '0');
      html += `<tr class="${cls}">
        <td>${row[0] || ''}</td>
        <td>${row[1] || ''}</td>
        <td>${row[2] || '0'}</td>
        <td>${row[3] || '0'}</td>
        <td>${row[4] || '0'}</td>
        <td>${tchCell}</td>
        <td class="${remClass}">${row[6] || '0'}</td>
      </tr>`;
    });

    // Totals row
    if (totals.length > 0) {
      const t = totals[0];
      html += `<tr class="totals">
        <td colspan="2">Total — All Books</td>
        <td>${t[2]||'0'}</td><td>${t[3]||'0'}</td>
        <td>${t[4]||'0'}</td><td>${t[5]||'0'}</td>
        <td>${t[6]||'0'}</td>
      </tr>`;
    }

    html += '</tbody></table>';
    html += `<div style="padding:12px 16px; font-size:11px; color:var(--ink-light); border-top:1px solid var(--border);">
      🟢 Sufficient &nbsp;🟡 Low (≤5) &nbsp;🔴 Out of stock &nbsp;
      <button class="btn-link" onclick="loadSummary()">↻ Refresh</button>
    </div>`;
    document.getElementById('summary-area').innerHTML = html;
  } catch(e) {
    document.getElementById('summary-area').innerHTML =
      `<div class="loading" style="color:var(--danger);">Failed to load inventory: ${e.message}</div>`;
  }
}

// ── Log Replacement ───────────────────────────────────────────
async function logReplacement() {
  const date     = document.getElementById('rep-date').value;
  const student  = document.getElementById('rep-student').value.trim();
  const level    = document.getElementById('rep-level').value;
  const type     = document.getElementById('rep-type').value;
  const reason   = document.getElementById('rep-reason').value;
  const notes    = document.getElementById('rep-notes').value.trim();

  if (!date || !student || !level || !type || !reason) {
    showToast('Please fill in all required fields', true); return;
  }
  try {
    await sheetsAppend('Replacements', [[date, student, level, type, reason, notes, 'Admin']]);
    showToast('Replacement logged successfully');
    clearRepForm();
    loadSummary();
  } catch(e) {
    showToast('Failed to save: ' + e.message, true);
  }
}

function clearRepForm() {
  ['rep-date','rep-student','rep-notes'].forEach(id => document.getElementById(id).value = '');
  ['rep-level','rep-type','rep-reason'].forEach(id => document.getElementById(id).value = '');
}

// ── Log Teacher Copy ──────────────────────────────────────────
async function logTeacherCopy() {
  const date     = document.getElementById('tch-date').value;
  const teacher  = document.getElementById('tch-teacher').value.trim();
  const level    = document.getElementById('tch-level').value;
  const type     = document.getElementById('tch-type').value;
  const reason   = document.getElementById('tch-reason').value;
  const notes    = document.getElementById('tch-notes').value.trim();
  const returned = document.getElementById('tch-returned').value;

  if (!date || !teacher || !level || !type || !reason) {
    showToast('Please fill in all required fields', true); return;
  }
  try {
    await sheetsAppend('TeacherCopies', [[date, teacher, level, type, reason, notes, returned, 'Admin']]);
    showToast('Teacher copy logged successfully');
    clearTchForm();
    loadSummary();
  } catch(e) {
    showToast('Failed to save: ' + e.message, true);
  }
}

function clearTchForm() {
  ['tch-date','tch-teacher','tch-notes'].forEach(id => document.getElementById(id).value = '');
  ['tch-level','tch-type','tch-reason'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('tch-returned').value = 'No';
}

// ── Helpers ───────────────────────────────────────────────────
function setDefaultDates() {
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('rep-date').value = today;
  document.getElementById('tch-date').value = today;
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '') + ' show';
  setTimeout(() => t.className = 'toast', 3000);
}
</script>
</body>
</html>
